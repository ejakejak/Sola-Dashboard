<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track your order · Sola Konveksi</title>
  <link rel="stylesheet" href="file:///D:/Sola/app/static/css/app.css">
  <style>
    /* Public /track — mobile-first, single column, no admin chrome. */
    body { display: flex; justify-content: center; padding: 4px 0 8px; }
    .pwrap { max-width: 560px; padding: 24px 16px; }
    .pwrap .logo { display: flex; align-items: center; gap: 10px; }
    .pwrap .logo img { height: 40px; }
    .pwrap .logo span { font-weight: 700; color: var(--text); }
    .pwrap h1 { font-size: 26px; }
    .pwrap .sub { font-size: var(--fs-sm); color: var(--text-muted); padding: 0 0 12px; }
    .track-input input { min-height: 48px; font-size: 18px; letter-spacing: .5px;
                         font-family: ui-monospace, monospace; text-transform: uppercase; }
    .track-input .btn { min-height: 48px; font-size: 16px; width: 100%; }
    .result-grid .kv { display: flex; width: 100%; }
    .bar { flex: 1; height: 8px; border-radius: 99px; background: var(--border); }
    .bar > i { display: block; height: 8px; border-radius: 99px; background:
             var(--warning); }
    .timeline .tl-row { display: flex; align-items: center; gap: 10px; padding: 9px 2px;
                        border-bottom: 1px solid var(--border); }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
               gap: 10px; }
    .gallery figure { border: 1px solid var(--border); border-radius: 8px; }
    .gallery img { width: 100%; height: 110px; object-fit: cover; border-radius: 7px; }
    .gallery figcaption { font-size: 10px; color: var(--text-muted); text-align: center;
                          padding: 3px 0; }
    a.home { color: var(--brand); font-size: var(--fs-sm); }
  </style>
</head>
<body>
<div class="pwrap">
  <div class="logo">
    <img src="file:///D:/Sola/app/static/assets/sola-logo-1.png" alt="Sola">
    <span>Sola Konveksi</span>
  </div>

  <h1>Track your order</h1>
  <p class="sub">Enter the production code printed on your invoice. Example: PRD-260922-001</p>

  

  <form method="post" class="form-row track-input">
    <input type="text" name="code" value="" placeholder="PRD-XXXXXX-XXX"
           minlength="6" required autofocus autocomplete="off">
    <button class="btn btn-primary" type="submit">Track</button>
  </form>

  
  <div class="card" style="border-style:dashed">
    <p style="padding:0;font-size:var(--fs-sm);color:var(--text-muted)">Code not found?
      Check with your sales contact.</p>
  </div>
  

  <p style="padding-top:18px;font-size:var(--fs-sm)"><a class="home" href="/login">Staff sign in →</a></p>
</div>
</body>
</html>
