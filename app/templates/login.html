<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · SOLA Konveksi</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo">
      <img src="{{ url_for('static', filename='assets/sola-logo-1.png') }}" alt="SOLA">
      <span>Sola Konveksi</span>
    </div>
    <h1>Sign in</h1>
    <p class="sub">Internal production dashboard</p>
    {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="form-row">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-row">
        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit" style="flex:1">Sign in</button>
      </div>
    </form>
    <p style="margin-top:14px;font-size:13px;color:var(--text-muted)">
      Customer? <a href="{{ url_for('track.track') }}">Track your order</a>
    </p>
  </div>
</div>
</body>
</html>
